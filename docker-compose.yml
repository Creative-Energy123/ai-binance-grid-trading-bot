# Local / single-host stack. Nginx terminates HTTP and proxies the API + SPA.
services:
  db:
    image: postgres:16-alpine
    container_name: scalper_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scalper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scalper}
      POSTGRES_DB: ${POSTGRES_DB:-scalper}
    volumes:
      - scalper-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scalper}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: scalper_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scalper_app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scalper}:${POSTGRES_PASSWORD:-scalper}@db:5432/${POSTGRES_DB:-scalper}
      REDIS_URL: redis://redis:6379/0
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      # The bot always comes up stopped; the mode only decides what it *could* do.
      TRADING_MODE: ${TRADING_MODE:-paper}
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: scalper_nginx
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  scalper-pgdata:
