name: AI Grid Trading Bot — CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: creative-energy123/ai-binance-grid-trading-bot

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for app image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ${{ env.REGISTRY }}
          APP_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          SITE_URL: ${{ vars.SITE_URL }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          BINANCE_TESTNET: ${{ vars.BINANCE_TESTNET }}
          MAX_CAPITAL_USDT: ${{ vars.MAX_CAPITAL_USDT }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          AI_ANALYSIS_INTERVAL_MINUTES: ${{ vars.AI_ANALYSIS_INTERVAL_MINUTES }}
          AI_AUTO_APPLY: ${{ vars.AI_AUTO_APPLY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          envs: REGISTRY,APP_IMAGE,SITE_URL,APP_DOMAIN,CORS_ORIGINS,BINANCE_TESTNET,MAX_CAPITAL_USDT,POSTGRES_USER,POSTGRES_DB,AI_ANALYSIS_INTERVAL_MINUTES,AI_AUTO_APPLY,ADMIN_EMAIL,ADMIN_PASSWORD,JWT_SECRET,BINANCE_API_KEY,BINANCE_API_SECRET,ANTHROPIC_API_KEY,POSTGRES_PASSWORD,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,ALERT_WEBHOOK_URL,VPS_PASSWORD,GH_TOKEN
          script: |
            set -e

            APP_DIR=~/ai-binance-grid-trading-bot
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            echo "$VPS_PASSWORD" | sudo -S docker login "$REGISTRY" -u "${{ github.actor }}" -p "$GH_TOKEN"

            echo "$VPS_PASSWORD" | sudo -S docker pull "$APP_IMAGE"

            echo "$VPS_PASSWORD" | sudo -S docker network create web 2>/dev/null || true

            # Defaults when repository variables are unset
            : "${SITE_URL:=https://trade.creativeenergy.pk}"
            : "${APP_DOMAIN:=trade.creativeenergy.pk}"
            : "${CORS_ORIGINS:=https://trade.creativeenergy.pk}"
            : "${BINANCE_TESTNET:=true}"
            : "${MAX_CAPITAL_USDT:=500}"
            : "${POSTGRES_USER:=gridbot}"
            : "${POSTGRES_DB:=gridbot}"
            : "${AI_ANALYSIS_INTERVAL_MINUTES:=30}"
            : "${AI_AUTO_APPLY:=false}"

            cat > docker-compose.yml <<COMPOSE
            version: "3.8"

            services:
              db:
                image: postgres:16-alpine
                container_name: gridbot_db
                restart: unless-stopped
                environment:
                  POSTGRES_USER: "$POSTGRES_USER"
                  POSTGRES_PASSWORD: "$POSTGRES_PASSWORD"
                  POSTGRES_DB: "$POSTGRES_DB"
                volumes:
                  - gridbot-pgdata:/var/lib/postgresql/data
                networks:
                  - web
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              redis:
                image: redis:7-alpine
                container_name: gridbot_redis
                restart: unless-stopped
                networks:
                  - web
                healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 10s
                  timeout: 3s
                  retries: 5

              gridbot:
                image: $APP_IMAGE
                container_name: gridbot_app
                restart: unless-stopped
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                environment:
                  HOST: 0.0.0.0
                  PORT: "8000"
                  SITE_URL: "$SITE_URL"
                  CORS_ORIGINS: "$CORS_ORIGINS"
                  DATABASE_URL: "postgresql+asyncpg://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/$POSTGRES_DB"
                  REDIS_URL: redis://redis:6379/0
                  ADMIN_EMAIL: "$ADMIN_EMAIL"
                  ADMIN_PASSWORD: "$ADMIN_PASSWORD"
                  JWT_SECRET: "$JWT_SECRET"
                  BINANCE_API_KEY: "$BINANCE_API_KEY"
                  BINANCE_API_SECRET: "$BINANCE_API_SECRET"
                  BINANCE_TESTNET: "$BINANCE_TESTNET"
                  MAX_CAPITAL_USDT: "$MAX_CAPITAL_USDT"
                  ANTHROPIC_API_KEY: "$ANTHROPIC_API_KEY"
                  AI_ANALYSIS_INTERVAL_MINUTES: "$AI_ANALYSIS_INTERVAL_MINUTES"
                  AI_AUTO_APPLY: "$AI_AUTO_APPLY"
                  TELEGRAM_BOT_TOKEN: "$TELEGRAM_BOT_TOKEN"
                  TELEGRAM_CHAT_ID: "$TELEGRAM_CHAT_ID"
                  ALERT_WEBHOOK_URL: "$ALERT_WEBHOOK_URL"
                networks:
                  - web
                labels:
                  - traefik.enable=true
                  - traefik.docker.network=web
                  - traefik.http.routers.gridbot.rule=Host(\`$APP_DOMAIN\`) || Host(\`www.$APP_DOMAIN\`)
                  - traefik.http.routers.gridbot.entrypoints=websecure
                  - traefik.http.routers.gridbot.tls.certresolver=letsencrypt
                  - traefik.http.services.gridbot.loadbalancer.server.port=8000
                  - traefik.http.routers.gridbot-http.rule=Host(\`$APP_DOMAIN\`) || Host(\`www.$APP_DOMAIN\`)
                  - traefik.http.routers.gridbot-http.entrypoints=web
                  - traefik.http.routers.gridbot-http.middlewares=gridbot-https-redirect
                  - traefik.http.middlewares.gridbot-https-redirect.redirectscheme.scheme=https
                  - traefik.http.middlewares.gridbot-https-redirect.redirectscheme.permanent=true
                  - traefik.http.middlewares.gridbot-headers.headers.stsSeconds=31536000
                  - traefik.http.middlewares.gridbot-headers.headers.stsIncludeSubdomains=true
                  - traefik.http.routers.gridbot.middlewares=gridbot-headers

            networks:
              web:
                external: true

            volumes:
              gridbot-pgdata:
            COMPOSE

            echo "=== Generated docker-compose.yml ==="
            # Redact secrets from log preview
            sed -E 's/(PASSWORD|SECRET|API_KEY|API_SECRET|TOKEN|WEBHOOK_URL): "[^"]*"/\1: "***"/g' docker-compose.yml || cat docker-compose.yml

            echo "$VPS_PASSWORD" | sudo -S docker compose down || true
            echo "$VPS_PASSWORD" | sudo -S docker rm -f gridbot_app 2>/dev/null || true

            echo "$VPS_PASSWORD" | sudo -S docker compose up -d

            sleep 20

            echo "=== Container Status ==="
            echo "$VPS_PASSWORD" | sudo -S docker compose ps
            echo "$VPS_PASSWORD" | sudo -S docker ps -a --filter "name=gridbot" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

            echo "=== App Logs ==="
            echo "$VPS_PASSWORD" | sudo -S docker compose logs --tail 50 gridbot

            echo "=== Health check (internal) ==="
            echo "$VPS_PASSWORD" | sudo -S docker exec gridbot_app curl -fsS http://127.0.0.1:8000/api/health || echo "Health check failed"

            echo "=== DNS check ==="
            if getent hosts "$APP_DOMAIN" >/dev/null 2>&1; then
              echo "OK: $APP_DOMAIN resolves"
              getent hosts "$APP_DOMAIN"
            else
              echo "ERROR: $APP_DOMAIN does NOT resolve in DNS."
              echo "Add an A record for trade.creativeenergy.pk pointing at this VPS IP."
            fi

            echo "$VPS_PASSWORD" | sudo -S docker image prune -f || true

            echo "Deployment completed."
            echo "Site: $SITE_URL"

      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          envs: VPS_PASSWORD
          script: |
            cd ~/ai-binance-grid-trading-bot
            echo "$VPS_PASSWORD" | sudo -S docker compose ps
            echo "=== App Logs ==="
            echo "$VPS_PASSWORD" | sudo -S docker compose logs --tail 30 gridbot
            echo "$VPS_PASSWORD" | sudo -S docker exec gridbot_app curl -fsS http://127.0.0.1:8000/api/health || true
            echo ""
            echo "Application URL:"
            echo "  Site: https://trade.creativeenergy.pk"
