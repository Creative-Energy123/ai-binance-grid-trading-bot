name: Adaptive Scalping Bot — CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reset_database:
        description: >-
          DESTRUCTIVE: dump, then delete the Postgres volume and start from an
          empty database. Needed once when migrating off the grid bot, whose
          trades/ai_analyses/audit_logs tables collide with the new schema.
        type: boolean
        default: false
      rebuild_image:
        description: Remove the cached image on the VPS and pull it again
        type: boolean
        default: true
      ssh_debug:
        description: Verbose SSH output, for diagnosing connection failures
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: creative-energy123/ai-binance-grid-trading-bot

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint backend
        working-directory: backend
        run: python -m ruff check app tests

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for app image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # A missing encryption key would deploy an app that cannot store API
      # credentials, and a changed one would orphan the credentials already
      # stored. Fail loudly here rather than at runtime.
      - name: Require credential encryption key
        env:
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
        run: |
          if [ -z "$CREDENTIALS_ENCRYPTION_KEY" ]; then
            echo "::error::CREDENTIALS_ENCRYPTION_KEY secret is not set."
            echo "Generate one ONCE and store it in repository secrets (and your password manager):"
            echo '  python -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())"'
            echo "Never regenerate it for an existing deployment: stored Binance keys become unreadable."
            exit 1
          fi
          python - <<'PY'
          import base64, os, sys
          raw = os.environ["CREDENTIALS_ENCRYPTION_KEY"].strip()
          try:
              key = base64.urlsafe_b64decode(raw)
          except Exception:
              sys.exit("::error::CREDENTIALS_ENCRYPTION_KEY is not valid urlsafe base64")
          if len(key) != 32:
              sys.exit(f"::error::CREDENTIALS_ENCRYPTION_KEY decodes to {len(key)} bytes, AES-256 needs 32")
          print("Encryption key format OK")
          PY

      # A password containing @ : / # or % breaks a raw URL, producing a
      # "password authentication failed" that looks like a wrong password.
      - name: Percent-encode the database password
        id: dbpw
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          python - <<'PYENC' >> "$GITHUB_OUTPUT"
          import os, urllib.parse
          print("encoded=" + urllib.parse.quote(os.environ.get("POSTGRES_PASSWORD", ""), safe=""))
          PYENC

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ${{ env.REGISTRY }}
          APP_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          RESET_DATABASE: ${{ inputs.reset_database }}
          REBUILD_IMAGE: ${{ inputs.rebuild_image }}
          # --- repository variables (non-secret) ---
          SITE_URL: ${{ vars.SITE_URL }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          TRADING_MODE: ${{ vars.TRADING_MODE }}
          SYMBOLS: ${{ vars.SYMBOLS }}
          FUTURES_ENABLED: ${{ vars.FUTURES_ENABLED }}
          FUTURES_LEVERAGE: ${{ vars.FUTURES_LEVERAGE }}
          RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT }}
          MAX_DAILY_LOSS_PCT: ${{ vars.MAX_DAILY_LOSS_PCT }}
          MAX_POSITIONS: ${{ vars.MAX_POSITIONS }}
          MINIMUM_SIGNAL_SCORE: ${{ vars.MINIMUM_SIGNAL_SCORE }}
          TAKER_FEE_PCT: ${{ vars.TAKER_FEE_PCT }}
          SLIPPAGE_PCT: ${{ vars.SLIPPAGE_PCT }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          # --- secrets ---
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          BINANCE_PROXY: ${{ secrets.BINANCE_PROXY }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_PASSWORD_ENC: ${{ steps.dbpw.outputs.encoded }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          # Key auth is used when VPS_SSH_KEY is set; otherwise the password is.
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          debug: ${{ inputs.ssh_debug == true }}
          command_timeout: 20m
          port: ${{ vars.VPS_PORT || secrets.VPS_PORT || 22 }}
          envs: REGISTRY,APP_IMAGE,RESET_DATABASE,REBUILD_IMAGE,SITE_URL,APP_DOMAIN,CORS_ORIGINS,TRADING_MODE,SYMBOLS,FUTURES_ENABLED,FUTURES_LEVERAGE,RISK_PER_TRADE_PCT,MAX_DAILY_LOSS_PCT,MAX_POSITIONS,MINIMUM_SIGNAL_SCORE,TAKER_FEE_PCT,SLIPPAGE_PCT,POSTGRES_USER,POSTGRES_DB,ANTHROPIC_MODEL,CREDENTIALS_ENCRYPTION_KEY,ADMIN_EMAIL,ADMIN_PASSWORD,JWT_SECRET,BINANCE_API_KEY,BINANCE_API_SECRET,BINANCE_PROXY,HTTPS_PROXY,ANTHROPIC_API_KEY,POSTGRES_PASSWORD,POSTGRES_PASSWORD_ENC,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,ALERT_WEBHOOK_URL,VPS_PASSWORD,GH_TOKEN
          script: |
            set -e

            APP_DIR=~/ai-binance-grid-trading-bot
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            echo "$VPS_PASSWORD" | sudo -S docker login "$REGISTRY" -u "${{ github.actor }}" -p "$GH_TOKEN"

            # Stop the old stack before touching images or volumes.
            echo "$VPS_PASSWORD" | sudo -S docker compose down || true
            echo "$VPS_PASSWORD" | sudo -S docker rm -f gridbot_app gridbot_db gridbot_redis 2>/dev/null || true

            if [ "$REBUILD_IMAGE" = "true" ]; then
              echo "=== Dropping the cached image so the new one is definitely pulled ==="
              echo "$VPS_PASSWORD" | sudo -S docker rmi -f "$APP_IMAGE" 2>/dev/null || true
            fi
            echo "$VPS_PASSWORD" | sudo -S docker pull "$APP_IMAGE"
            echo "$VPS_PASSWORD" | sudo -S docker image inspect "$APP_IMAGE" --format 'Deploying image {{.Id}} built {{.Created}}'

            if [ "$RESET_DATABASE" = "true" ]; then
              echo "=== RESET: backing up, then deleting the Postgres volume ==="
              STAMP=$(date +%Y%m%d-%H%M%S)

              # Compose prefixes project volumes with the project name, so the
              # real volume is <project>_gridbot-pgdata. Resolve it rather than
              # guessing: naming it wrong would silently create a new empty
              # volume, "back that up", and leave the real data in place.
              VOL=$(echo "$VPS_PASSWORD" | sudo -S docker volume ls -q | grep -E '(^|_)gridbot-pgdata$' | head -n1)

              if [ -z "$VOL" ]; then
                echo "No gridbot-pgdata volume found; nothing to reset."
              else
                echo "Resolved volume: $VOL"
                if echo "$VPS_PASSWORD" | sudo -S docker run --rm -v "$VOL":/var/lib/postgresql/data -v "$PWD":/backup alpine tar czf "/backup/pgdata-backup-$STAMP.tar.gz" -C /var/lib/postgresql data; then
                  ls -lh "pgdata-backup-$STAMP.tar.gz"
                  echo "Volume archived to $PWD/pgdata-backup-$STAMP.tar.gz"
                else
                  echo "ERROR: could not archive $VOL. Refusing to delete it."
                  exit 1
                fi

                if echo "$VPS_PASSWORD" | sudo -S docker volume rm "$VOL"; then
                  echo "Volume $VOL deleted."
                else
                  echo "Direct removal failed; retrying via compose down -v"
                  echo "$VPS_PASSWORD" | sudo -S docker compose down -v --remove-orphans || true
                  echo "$VPS_PASSWORD" | sudo -S docker volume rm "$VOL" || true
                fi

                if echo "$VPS_PASSWORD" | sudo -S docker volume ls -q | grep -qE '(^|_)gridbot-pgdata$'; then
                  echo "ERROR: the volume still exists after the reset. Aborting."
                  exit 1
                fi
                echo "Reset complete: the database will be created from scratch."
              fi
            fi

            echo "$VPS_PASSWORD" | sudo -S docker network create web 2>/dev/null || true

            # Defaults when repository variables are unset. TRADING_MODE stays on
            # paper: promoting to testnet or live is a deliberate act, not a default.
            : "${SITE_URL:=https://trade.creativeenergy.pk}"
            : "${APP_DOMAIN:=trade.creativeenergy.pk}"
            : "${CORS_ORIGINS:=https://trade.creativeenergy.pk}"
            : "${TRADING_MODE:=paper}"
            : "${SYMBOLS:=BTC/USDT,ETH/USDT,BNB/USDT,SOL/USDT}"
            : "${FUTURES_ENABLED:=false}"
            : "${FUTURES_LEVERAGE:=3}"
            : "${RISK_PER_TRADE_PCT:=0.35}"
            : "${MAX_DAILY_LOSS_PCT:=2}"
            : "${MAX_POSITIONS:=2}"
            : "${MINIMUM_SIGNAL_SCORE:=75}"
            : "${TAKER_FEE_PCT:=0.04}"
            : "${SLIPPAGE_PCT:=0.02}"
            : "${POSTGRES_USER:=gridbot}"
            : "${POSTGRES_DB:=gridbot}"
            : "${ANTHROPIC_MODEL:=claude-sonnet-5}"

            # Secrets are written to a literal env file with printf, never
            # interpolated into the compose YAML. Compose performs its own $
            # substitution on the YAML, which silently corrupts any value
            # containing a dollar sign — and corrupts it differently for the
            # database and the app, producing an authentication failure that
            # looks like a wrong password.
            umask 077

            # Secrets never reach the compose YAML: Compose runs its own $
            # substitution when reading it, which corrupts any value containing a
            # dollar sign. They go into a literal env file, which Compose passes
            # through untouched.
            #
            # CR/LF is stripped from every value: a secret pasted with a trailing
            # newline would otherwise split the file and truncate the rest of it.
            clean() { printf '%s' "$1" | tr -d '\r\n'; }
            put() { printf '%s=%s\n' "$1" "$(clean "$2")"; }

            DB_USER=$(clean "$POSTGRES_USER")
            DB_NAME=$(clean "$POSTGRES_DB")
            DB_PASS_ENC=$(clean "$POSTGRES_PASSWORD_ENC")

            {
              put POSTGRES_USER "$POSTGRES_USER"
              put POSTGRES_PASSWORD "$POSTGRES_PASSWORD"
              put POSTGRES_DB "$POSTGRES_DB"
              put HOST "0.0.0.0"
              put PORT "8000"
              put SITE_URL "$SITE_URL"
              put CORS_ORIGINS "$CORS_ORIGINS"
              put REDIS_URL "redis://redis:6379/0"
              put CREDENTIALS_ENCRYPTION_KEY "$CREDENTIALS_ENCRYPTION_KEY"
              put ADMIN_EMAIL "$ADMIN_EMAIL"
              put ADMIN_PASSWORD "$ADMIN_PASSWORD"
              put JWT_SECRET "$JWT_SECRET"
              put TRADING_MODE "$TRADING_MODE"
              put SYMBOLS "$SYMBOLS"
              put FUTURES_ENABLED "$FUTURES_ENABLED"
              put FUTURES_LEVERAGE "$FUTURES_LEVERAGE"
              put RISK_PER_TRADE_PCT "$RISK_PER_TRADE_PCT"
              put MAX_DAILY_LOSS_PCT "$MAX_DAILY_LOSS_PCT"
              put MAX_POSITIONS "$MAX_POSITIONS"
              put MINIMUM_SIGNAL_SCORE "$MINIMUM_SIGNAL_SCORE"
              put TAKER_FEE_PCT "$TAKER_FEE_PCT"
              put SLIPPAGE_PCT "$SLIPPAGE_PCT"
              put BINANCE_API_KEY "$BINANCE_API_KEY"
              put BINANCE_API_SECRET "$BINANCE_API_SECRET"
              put BINANCE_PROXY "$BINANCE_PROXY"
              put HTTPS_PROXY "$HTTPS_PROXY"
              put ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
              put ANTHROPIC_MODEL "$ANTHROPIC_MODEL"
              put TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
              put TELEGRAM_CHAT_ID "$TELEGRAM_CHAT_ID"
              put ALERT_WEBHOOK_URL "$ALERT_WEBHOOK_URL"
              printf 'DATABASE_URL=postgresql+asyncpg://%s:%s@db:5432/%s\n' "$DB_USER" "$DB_PASS_ENC" "$DB_NAME"
            } > stack.env
            chmod 600 stack.env

            TOTAL=$(wc -l < stack.env)
            PAIRS=$(grep -c "^[A-Z_][A-Z_0-9]*=" stack.env)
            echo "stack.env: $TOTAL line(s), $PAIRS key=value pair(s) (values not logged)."
            if [ "$TOTAL" != "$PAIRS" ]; then
              echo "::error::stack.env is malformed - a value still contains a line break."
              exit 1
            fi
            cat > docker-compose.yml <<COMPOSE
            services:
              db:
                image: postgres:16-alpine
                container_name: scalper_db
                restart: unless-stopped
                env_file:
                  - stack.env
                volumes:
                  - gridbot-pgdata:/var/lib/postgresql/data
                networks:
                  - web
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              redis:
                image: redis:7-alpine
                container_name: scalper_redis
                restart: unless-stopped
                networks:
                  - web
                healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 10s
                  timeout: 3s
                  retries: 5

              scalper:
                image: $APP_IMAGE
                container_name: scalper_app
                restart: unless-stopped
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                env_file:
                  - stack.env
                networks:
                  - web
                labels:
                  - traefik.enable=true
                  - traefik.docker.network=web
                  - traefik.http.routers.scalper.rule=Host(\`$APP_DOMAIN\`) || Host(\`www.$APP_DOMAIN\`)
                  - traefik.http.routers.scalper.entrypoints=websecure
                  - traefik.http.routers.scalper.tls.certresolver=letsencrypt
                  - traefik.http.services.scalper.loadbalancer.server.port=8000
                  - traefik.http.routers.scalper-http.rule=Host(\`$APP_DOMAIN\`) || Host(\`www.$APP_DOMAIN\`)
                  - traefik.http.routers.scalper-http.entrypoints=web
                  - traefik.http.routers.scalper-http.middlewares=scalper-https-redirect
                  - traefik.http.middlewares.scalper-https-redirect.redirectscheme.scheme=https
                  - traefik.http.middlewares.scalper-https-redirect.redirectscheme.permanent=true
                  - traefik.http.middlewares.scalper-headers.headers.stsSeconds=31536000
                  - traefik.http.middlewares.scalper-headers.headers.stsIncludeSubdomains=true
                  - traefik.http.routers.scalper.middlewares=scalper-headers

            networks:
              web:
                external: true

            volumes:
              gridbot-pgdata:
            COMPOSE

            echo "=== Generated docker-compose.yml ==="
            sed -E 's/(PASSWORD|SECRET|API_KEY|API_SECRET|TOKEN|WEBHOOK_URL|ENCRYPTION_KEY): "[^"]*"/\1: "***"/g' docker-compose.yml || true

            echo "$VPS_PASSWORD" | sudo -S docker compose up -d --force-recreate

            echo "=== Waiting for Postgres ==="
            for i in $(seq 1 30); do
              if echo "$VPS_PASSWORD" | sudo -S docker compose exec -T db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
                echo "Postgres ready."
                break
              fi
              sleep 2
            done

            echo "=== Reconciling the database role password ==="
            # A Postgres volume keeps the password it was initialised with, so a
            # rotated (or previously corrupted) secret leaves the app unable to
            # authenticate even though everything else is correct. Connections over
            # the container's local socket are trusted, so the role password can be
            # set to the configured value without destroying any data.
            PW_SQL=$(clean "$POSTGRES_PASSWORD" | sed "s/'/''/g")
            if echo "$VPS_PASSWORD" | sudo -S docker compose exec -T db psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -q -c "ALTER USER \"$DB_USER\" WITH PASSWORD '$PW_SQL';"; then
              echo "Role $DB_USER now matches the configured secret."
              echo "$VPS_PASSWORD" | sudo -S docker compose restart scalper >/dev/null 2>&1 || true
              sleep 8
            else
              echo "WARNING: could not reconcile the role password; the app may fail to authenticate."
            fi

            echo "=== Legacy schema check ==="
            LEGACY=$(echo "$VPS_PASSWORD" | sudo -S docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select count(*) from information_schema.tables where table_name in ('grid_configs','grid_levels','bot_state')" 2>/dev/null | tr -d '[:space:]')
            if [ "${LEGACY:-0}" != "0" ]; then
              echo "################################################################"
              echo "# This database still holds the grid bot schema. Its trades,   #"
              echo "# ai_analyses and audit_logs tables share names with the new   #"
              echo "# ones but have different columns, so the app cannot run on it.#"
              echo "#                                                              #"
              echo "# Re-run this workflow from the Actions tab with               #"
              echo "# reset_database ticked. It archives the volume first.         #"
              echo "################################################################"
              exit 1
            fi

            echo "=== Database migrations ==="
            if echo "$VPS_PASSWORD" | sudo -S docker compose exec -T scalper python -m alembic upgrade head; then
              echo "Migrations applied."
            else
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              echo "!! MIGRATIONS DID NOT RUN. The app creates missing tables at  !!"
              echo "!! boot, so a fresh install still works, but an UPGRADE to an !!"
              echo "!! existing database will NOT pick up schema changes.         !!"
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            fi

            sleep 15

            echo "=== Container Status ==="
            echo "$VPS_PASSWORD" | sudo -S docker compose ps

            echo "=== App Logs ==="
            echo "$VPS_PASSWORD" | sudo -S docker compose logs --tail 50 scalper

            echo "=== Health check (internal) ==="
            # The app can legitimately report "degraded" (for example when Binance
            # is unreachable), but it must be answering at all. A container that is
            # restarting in a loop has repeatedly been reported as a good deploy.
            HEALTH=""
            for i in $(seq 1 12); do
              HEALTH=$(echo "$VPS_PASSWORD" | sudo -S docker exec scalper_app curl -fsS http://127.0.0.1:8000/api/health 2>/dev/null) && break
              sleep 5
            done
            if [ -z "$HEALTH" ]; then
              echo "::error::The app never answered /api/health. Recent logs:"
              echo "$VPS_PASSWORD" | sudo -S docker compose logs --tail 60 scalper
              exit 1
            fi
            echo "$HEALTH"

            echo "=== DNS check ==="
            if getent hosts "$APP_DOMAIN" >/dev/null 2>&1; then
              echo "OK: $APP_DOMAIN resolves"
            else
              echo "ERROR: $APP_DOMAIN does NOT resolve. Add an A record pointing at this VPS."
            fi

            echo "$VPS_PASSWORD" | sudo -S docker image prune -f || true

            echo "Deployment completed in $TRADING_MODE mode. The bot starts STOPPED and must be started from the dashboard."
            echo "Site: $SITE_URL"
